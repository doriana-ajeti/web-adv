<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form action="on">
        <div class="name-container">
           <label for="name" id="name">Name:</label>
           <input type="text" id="name" name="name">
           <span id="name_error">please enter a valid name</span>
        </div>
        <br>
        <div class="age-container">
           <label for="age" id="age_label" >age:</label>
           <input type="text" id="age">
           <span id="age_error">please enter your age</span>
        </div>
        <br>

        <div class="city-container">
         <label for="city" id="city_label">city:</label>
         <select name="name" id="city">
            <option value="" selected></option>
            <option value="prishtina">prishtina</option>
            <option value="prizreni">prizreni</option>
            <option value="gjilani">gjilani</option>
            <option value="mitrovica">mitrovica</option>
             <span id="city_error">please select a city</span>
         </select>
        <button type="submit" name="submit">send</button>
        </div>
    </form>
    <script src="app.js"></script>
</body>
</html>
